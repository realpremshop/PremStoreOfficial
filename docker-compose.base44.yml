# Base44 sandbox runbook for LuksShop.
#
# A static, no-build storefront (`index.html` + `assets/`) — no backend, no database.
# It is served from the cloned source by a plain static server, so edits to the HTML/CSS/JS
# are picked up on the next page load (no rebuild, but no hot reload either).
services:
  web:
    image: python:3.12-slim
    working_dir: /app
    # Static dev server over the bind-mounted source. Nothing is baked into an image.
    command: ["python", "-m", "http.server", "3000", "--bind", "0.0.0.0", "--directory", "/app"]
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    labels:
      base44.project: "LuksShop"
      base44.kind: "web"
      base44.port: "3000"
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:3000/', timeout=3); sys.exit(0 if b'LuksShop' in r.read(4096) else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
